<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1390 630" width="1390" height="630" role="img" aria-label="Patient pathway from referral to billing">
<title>Patient pathway from referral to billing</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.65"/></marker>
</defs>
<rect x="30" y="84" width="170" height="64" rx="12" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/><text x="115.0" y="112.5" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">Referral</text><text x="115.0" y="129.5" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">received</text><path d="M345 70 L430 116 L345 162 L260 116 Z" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/><text x="345" y="112.0" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">Patient record</text><text x="345" y="129.0" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">exists?</text><rect x="490" y="84" width="170" height="64" rx="12" fill="#2860dd" fill-opacity="0.12" stroke="#2860dd" stroke-opacity="1" stroke-width="1.5"/><text x="575.0" y="109.3" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">Register patient</text><text x="575.0" y="124.3" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.65" font-family="DM Sans, Inter, system-ui, sans-serif">with duplicate check</text><rect x="720" y="84" width="170" height="64" rx="12" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/><text x="805.0" y="121.0" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">Episode of care</text><rect x="950" y="84" width="170" height="64" rx="12" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/><text x="1035.0" y="109.3" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">Booking task</text><text x="1035.0" y="124.3" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.65" font-family="DM Sans, Inter, system-ui, sans-serif">priority + status</text><path d="M200 116 H260" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M430 116 H490" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><text x="460" y="108" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.7" font-family="DM Sans, Inter, system-ui, sans-serif">No</text><path d="M660 116 H720" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M890 116 H950" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M345 70 V40 H805 V84" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><text x="575" y="32" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.7" font-family="DM Sans, Inter, system-ui, sans-serif">Yes: open the record and add a new episode</text><path d="M1035 148 V192 H115 V236" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="30" y="236" width="170" height="64" rx="12" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/><text x="115.0" y="264.5" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">Schedule</text><text x="115.0" y="281.5" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">appointment</text><rect x="260" y="236" width="170" height="64" rx="12" fill="#2860dd" fill-opacity="0.12" stroke="#2860dd" stroke-opacity="1" stroke-width="1.5"/><text x="345.0" y="261.3" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">Patient arrives</text><text x="345.0" y="276.3" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.65" font-family="DM Sans, Inter, system-ui, sans-serif">check-in</text><path d="M575 222 L660 268 L575 314 L490 268 Z" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/><text x="575" y="264.0" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">Diagnostic</text><text x="575" y="281.0" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">appointment?</text><rect x="720" y="236" width="170" height="64" rx="12" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/><text x="805.0" y="264.5" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">Test carried</text><text x="805.0" y="281.5" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">out</text><rect x="950" y="236" width="170" height="64" rx="12" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/><text x="1035.0" y="261.3" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">Clinician confirms</text><text x="1035.0" y="276.3" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.65" font-family="DM Sans, Inter, system-ui, sans-serif">tests carried out</text><rect x="1180" y="236" width="170" height="64" rx="12" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/><text x="1265.0" y="261.3" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">Test logged</text><text x="1265.0" y="276.3" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.65" font-family="DM Sans, Inter, system-ui, sans-serif">activity report for billing</text><path d="M200 268 H260" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M430 268 H490" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M660 268 H720" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><text x="690" y="260" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.7" font-family="DM Sans, Inter, system-ui, sans-serif">Yes</text><path d="M890 268 H950" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M1120 268 H1180" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="490" y="400" width="170" height="64" rx="12" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/><text x="575.0" y="428.5" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">Patient sees</text><text x="575.0" y="445.5" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">consultant</text><path d="M575 314 V400" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><text x="583" y="362" text-anchor="start" font-size="12" fill="currentColor" fill-opacity="0.7" font-family="DM Sans, Inter, system-ui, sans-serif">No</text><path d="M805 386 L890 432 L805 478 L720 432 Z" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/><text x="805" y="428.0" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">Further test or</text><text x="805" y="445.0" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">appointment?</text><path d="M660 432 H720" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M1035 300 V350 H805 V386" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M890 432 H1372 V116 H1120" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1340" y="424" text-anchor="end" font-size="12" fill="currentColor" fill-opacity="0.7" font-family="DM Sans, Inter, system-ui, sans-serif">Yes: new task, same episode</text><rect x="720" y="540" width="170" height="64" rx="12" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/><text x="805.0" y="565.3" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor" font-family="DM Sans, Inter, system-ui, sans-serif">No new tasks</text><text x="805.0" y="580.3" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.65" font-family="DM Sans, Inter, system-ui, sans-serif">pathway ends</text><path d="M805 478 V540" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/><text x="813" y="514" text-anchor="start" font-size="12" fill="currentColor" fill-opacity="0.7" font-family="DM Sans, Inter, system-ui, sans-serif">No</text>
</svg>
